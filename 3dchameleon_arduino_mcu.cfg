[save_variables]
filename: /usr/data/printer_data/config/seletor_variables.cfg

[manual_stepper seletor]
step_pin: arduino:PD2
dir_pin: arduino:PD5
enable_pin: !arduino:PB0
rotation_distance: 40
microsteps: 16
velocity: 40
accel: 500

# --- Extrusora ligada no CNC Shield (Eixo Z) ---
[manual_stepper extrusora_trocador]
step_pin: arduino:PD4        # D4  (Z_STEP)
dir_pin: arduino:PD7         # D7  (Z_DIR)
enable_pin: !arduino:PB4     # D12 (Z_ENABLE)
microsteps: 16
rotation_distance: 8         # ajustar depois se quiser
velocity: 50
accel: 200

[gcode_macro BUFFER_STATE]
variable_ativo: 0
gcode:
    ; usado apenas para estado

[gcode_button buffer_vazio]
pin: ^!arduino:PC1  # ABORT - Microswitch 1 - Buffer vazio - HOLD da placa CNCShield
press_gcode:

release_gcode:
    BUFFER_VAZIO

[gcode_button buffer_cheio]
pin: ^!arduino:PC0 # HOLD - Microswitch 2 - Buffer cheio - ABORT da placa CNCShield
press_gcode:

release_gcode:
    BUFFER_CHEIO

[gcode_macro BUFFER_VAZIO]
gcode:
    {action_respond_info("BUFFER: vazio detectado, iniciando alimentação")}
    SET_GCODE_VARIABLE MACRO=BUFFER_STATE VARIABLE=ativo VALUE=1
    UPDATE_DELAYED_GCODE ID=FEED_BUFFER_LOOP DURATION=0.01

[gcode_macro BUFFER_CHEIO]
gcode:
    {action_respond_info("BUFFER: cheio, parando alimentação")}
    SET_GCODE_VARIABLE MACRO=BUFFER_STATE VARIABLE=ativo VALUE=0
    UPDATE_DELAYED_GCODE ID=FEED_BUFFER_LOOP DURATION=0
    MANUAL_STEPPER STEPPER=extrusora_trocador ENABLE=0
[delayed_gcode FEED_BUFFER_LOOP]
gcode:
    {% if printer["gcode_macro BUFFER_STATE"].ativo == 1 %}
        MANUAL_STEPPER STEPPER=extrusora_trocador ENABLE=1
        MANUAL_STEPPER STEPPER=extrusora_trocador MOVE=5 SPEED=20
        UPDATE_DELAYED_GCODE ID=FEED_BUFFER_LOOP DURATION=0.05
    {% else %}
        MANUAL_STEPPER STEPPER=extrusora_trocador ENABLE=0
        {action_respond_info("BUFFER: alimentação finalizada")}
    {% endif %}


[gcode_macro SELECT_TOOL]
variable_current_tool: 0
variable_is_homed: 0
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    
    {% if printer["gcode_macro SELECT_TOOL"].is_homed == 0 %}
        M117 Fazendo homing automático...
        HOME_SELETOR
    {% endif %}
    
    {% set distance_per_tool = 10 %}
    {% set move = tool * distance_per_tool %}
    
    M117 Selecionando T{tool}...
    MANUAL_STEPPER STEPPER=seletor ENABLE=1 MOVE={move} SPEED=50
    SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=current_tool VALUE={tool}
    SAVE_VARIABLE VARIABLE=last_tool VALUE={tool}
    M117 T{tool} Selecionado!

[gcode_macro HOME_SELETOR]
gcode:
    M117 Homing Seletor...
    MANUAL_STEPPER STEPPER=seletor ENABLE=1 SET_POSITION=40
    MANUAL_STEPPER STEPPER=seletor MOVE=0 SPEED=40
    MANUAL_STEPPER STEPPER=seletor SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=is_homed VALUE=1
    SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=current_tool VALUE=0
    SAVE_VARIABLE VARIABLE=last_tool VALUE=0
    M117 Home OK - T0 Pronto!

[delayed_gcode RESTORE_TOOL_STATE]
initial_duration: 3.0
gcode:
    {% set svv = printer.save_variables.variables %}
    
    M117 Auto-homing na inicialização...
    HOME_SELETOR
    
    {% if "last_tool" in svv %}
        {% set saved_tool = svv.last_tool %}
        {% if saved_tool != 0 %}
            M117 Restaurando T{saved_tool}...
            G4 P1000
            SELECT_TOOL TOOL={saved_tool}
            M117 T{saved_tool} Restaurado!
        {% else %}
            M117 T0 Pronto!
        {% endif %}
    {% else %}
        M117 T0 Pronto (primeira vez)
    {% endif %}

[gcode_macro T0]
gcode:
    SELECT_TOOL TOOL=0

[gcode_macro T1]
gcode:
    SELECT_TOOL TOOL=1

[gcode_macro T2]
gcode:
    SELECT_TOOL TOOL=2

[gcode_macro T3]
gcode:
    SELECT_TOOL TOOL=3

[gcode_macro CARREGAR_FILAMENTO]
gcode:
    {% set mm = params.MM|default(50)|float %}
    M117 Carregando {mm}mm...
    MANUAL_STEPPER STEPPER=extrusora_trocador ENABLE=1 MOVE={mm} SPEED=20

[gcode_macro DESCARREGAR_FILAMENTO]
gcode:
    {% set mm = params.MM|default(50)|float %}
    M117 Descarregando {mm}mm...
    MANUAL_STEPPER STEPPER=extrusora_trocador ENABLE=1 MOVE=-{mm} SPEED=20

[gcode_macro VER_FERRAMENTA_ATUAL]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if "last_tool" in svv %}
        M117 Ferramenta: T{svv.last_tool}
        {action_respond_info("Ferramenta salva: T%d" % svv.last_tool)}
    {% else %}
        M117 Nenhuma salva
    {% endif %}

[gcode_macro DESLIGAR_SELETOR]
gcode:
    M117 Desligando motor...
    MANUAL_STEPPER STEPPER=seletor ENABLE=0
    SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=is_homed VALUE=0
    M117 Motor desligado

[gcode_macro RESET_SELETOR]
gcode:
    SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=is_homed VALUE=0
    SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=current_tool VALUE=0
    M117 Resetado

[gcode_macro TESTE_EXTRUSORA_AVANCAR]
gcode:
    {% set mm = params.MM|default(10)|float %}
    {% set speed = params.SPEED|default(20)|float %}

    RESPOND MSG="Teste extrusora: avançando {mm}mm a {speed}mm/s"
    MANUAL_STEPPER STEPPER=extrusora_trocador ENABLE=1 MOVE={mm} SPEED={speed}
